[project]
name = "ignite-scrapers"
version = "0.1.0"
description = "Job posting scrapers for the Ignite job board"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28.1",
  "selectolax>=1.0.0",
  "extruct>=0.18.0",
  "psycopg[binary,pool]>=3.3.6",
]

[project.optional-dependencies]
browser = ["playwright>=1.63.0"]

[project.scripts]
ignite-worker = "ignite_scrapers.worker:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
