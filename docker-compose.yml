# Single-VM deployment. Copy .env.example to .env and fill it in, then:
#   docker-compose up -d --build
# The Playwright worker is opt-in until the browser pool lands (phase 5):
#   docker-compose --profile browser up -d
#
# Sign-in is FerrisKey (OIDC), served by Caddy at https://auth.<SITE_DOMAIN>. After the first
# `up`, set up its realm and login client once (and again whenever SMTP settings change):
#   docker-compose run --rm migrate pnpm auth:bootstrap --print-env
# then put the printed OIDC_CLIENT_SECRET into .env and `docker-compose up -d` again.

# Postgres is provisioned outside this stack. To reach a database on the Docker host, use
# host.docker.internal as the hostname (mapped below so it also works on Linux).
x-app-env: &app-env
  DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}

x-host-gateway: &host-gateway
  extra_hosts:
    - host.docker.internal:host-gateway

# FerrisKey keeps its data in its own database (`ferriskey`) on the same Postgres server.
x-ferriskey-db: &ferriskey-db
  DATABASE_HOST: ${FERRISKEY_DB_HOST:-host.docker.internal}
  DATABASE_PORT: ${FERRISKEY_DB_PORT:-5432}
  DATABASE_NAME: ferriskey
  DATABASE_USER: ${FERRISKEY_DB_USER:?set FERRISKEY_DB_USER}
  DATABASE_PASSWORD: ${FERRISKEY_DB_PASSWORD:?set FERRISKEY_DB_PASSWORD}

services:
  migrate:
    build: { context: ., target: migrate }
    <<: *host-gateway
    environment:
      <<: *app-env
      # Used by `pnpm auth:bootstrap` (see the top of this file).
      FERRISKEY_URL: https://auth.${SITE_DOMAIN}/api
      FERRISKEY_ADMIN_PASSWORD: ${FERRISKEY_ADMIN_PASSWORD}
      APP_BASE_URL: https://${SITE_DOMAIN}
      FERRISKEY_SMTP_HOST: ${SMTP_HOST:-}
      FERRISKEY_SMTP_PORT: ${SMTP_PORT:-587}
      FERRISKEY_SMTP_USER: ${SMTP_USER:-}
      FERRISKEY_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      FERRISKEY_SMTP_FROM: ${SMTP_FROM:-}
      FERRISKEY_SMTP_ENCRYPTION: ${SMTP_ENCRYPTION:-starttls}
    extra_hosts:
      - host.docker.internal:host-gateway
      - auth.${SITE_DOMAIN}:host-gateway
    restart: "no"

  api:
    build: { context: ., target: api }
    restart: unless-stopped
    environment:
      <<: *app-env
      APP_BASE_URL: https://${SITE_DOMAIN}
      OIDC_ISSUER: https://auth.${SITE_DOMAIN}/api/realms/ignite
      OIDC_CLIENT_ID: ignite_web
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?run pnpm auth:bootstrap, then set OIDC_CLIENT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
    extra_hosts:
      - host.docker.internal:host-gateway
      # Reach FerrisKey by its public name through Caddy on this host, so tokens carry the same
      # issuer the browser sees (FerrisKey derives the issuer from the Host header).
      - auth.${SITE_DOMAIN}:host-gateway
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    build: { context: ., target: web }
    restart: unless-stopped
    environment:
      API_URL: http://api:4000
    depends_on: [api]

  scraper:
    <<: *host-gateway
    build: { context: ./scrapers, target: http }
    restart: unless-stopped
    environment:
      <<: *app-env
      SCRAPER_USER_AGENT: ${SCRAPER_USER_AGENT:-}
    depends_on:
      migrate: { condition: service_completed_successfully }

  browser:
    <<: *host-gateway
    profiles: [browser]
    build: { context: ./scrapers, target: browser }
    restart: unless-stopped
    environment:
      <<: *app-env
      SCRAPER_USER_AGENT: ${SCRAPER_USER_AGENT:-}
    shm_size: 1gb
    mem_limit: 2g
    depends_on:
      migrate: { condition: service_completed_successfully }

  # FerrisKey as separate API + web images: the standalone image's bundled nginx overwrites
  # X-Forwarded-Proto, which turns the issuer into http:// behind Caddy's TLS.
  ferriskey-migrate:
    <<: *host-gateway
    image: ghcr.io/ferriskey/ferriskey-api:0.8.0
    entrypoint: ["sqlx"]
    command: ["migrate", "run", "--source", "/usr/local/src/ferriskey/migrations"]
    environment:
      # URL-encode the password if it contains reserved characters.
      DATABASE_URL: postgresql://${FERRISKEY_DB_USER}:${FERRISKEY_DB_PASSWORD}@${FERRISKEY_DB_HOST:-host.docker.internal}:${FERRISKEY_DB_PORT:-5432}/ferriskey
    restart: "no"

  ferriskey-api:
    <<: *host-gateway
    image: ghcr.io/ferriskey/ferriskey-api:0.8.0
    restart: unless-stopped
    environment:
      <<: *ferriskey-db
      SERVER_ROOT_PATH: /api
      WEBAPP_URL: https://auth.${SITE_DOMAIN}
      ALLOWED_ORIGINS: https://auth.${SITE_DOMAIN}
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ${FERRISKEY_ADMIN_PASSWORD:?set FERRISKEY_ADMIN_PASSWORD}
      ADMIN_EMAIL: ${FERRISKEY_ADMIN_EMAIL:?set FERRISKEY_ADMIN_EMAIL}
    depends_on:
      ferriskey-migrate: { condition: service_completed_successfully }

  ferriskey-webapp:
    image: ghcr.io/ferriskey/ferriskey-webapp:0.8.0
    restart: unless-stopped
    environment:
      API_URL: https://auth.${SITE_DOMAIN}/api
    depends_on: [ferriskey-api]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api, ferriskey-api, ferriskey-webapp]

volumes:
  caddy_data:
  caddy_config:
